services:
  distillerie-repas:
    build: .
    container_name: distillerie-repas
    restart: unless-stopped
    environment:
      PORT: 3000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-distillerie}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-session-secret}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8920}
    ports:
      - "127.0.0.1:8920:3000"
    volumes:
      - ./data:/app/data
    networks:
      - web-proxy

networks:
  web-proxy:
    external: true
